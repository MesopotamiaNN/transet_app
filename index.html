<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خطوط النقل - جامعة الناجي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body, html { height: 100%; overflow: hidden; background: #e5e7eb; }
        
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* شريط الترحيب */
        .welcome-bar {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: white; padding: 8px 20px; border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-weight: 900; color: #1e3a8a;
            display: flex; align-items: center; gap: 8px; font-size: 0.9rem; white-space: nowrap;
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 70px;
            background: white; z-index: 2000; box-shadow: 0 -2px 15px rgba(0,0,0,0.1);
            display: flex; justify-content: space-around; align-items: center;
            padding-bottom: env(safe-area-inset-bottom); /* لدعم آيفون */
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #64748b; font-size: 0.75rem; font-weight: 700; cursor: pointer;
            width: 25%; height: 100%; transition: 0.2s;
        }
        .nav-item i { font-size: 1.3rem; margin-bottom: 3px; }
        .nav-item.active { color: #1e3a8a; }
        .nav-item.test-driver { color: #ef4444; } /* لون مميز لزر التجربة */

        /* القائمة السفلية (Bottom Sheet) */
        .bottom-sheet {
            position: absolute; bottom: -120%; left: 0; width: 100%; height: 65%;
            background: white; z-index: 1500; border-radius: 25px 25px 0 0;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.1); transition: bottom 0.3s ease-in-out;
            display: flex; flex-direction: column;
        }
        .bottom-sheet.open { bottom: 70px; } /* يرتفع فوق شريط التنقل */
        
        .sheet-header { padding: 15px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .sheet-header h2 { font-size: 1.1rem; color: #1e3a8a; font-weight: 900; }
        .close-btn { background: #f1f5f9; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; color: #333; }

        /* فلتر المناطق */
        .filter-box { padding: 10px 15px; background: #f8fafc; border-bottom: 1px solid #eee; }
        .filter-box select {
            width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #cbd5e1;
            font-family: 'Cairo'; font-weight: 700; color: #1e3a8a; outline: none;
        }

        .list-container { padding: 15px; overflow-y: auto; flex: 1; }
        .driver-card {
            background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 15px;
            padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .driver-info h3 { font-size: 1rem; color: #1f2937; margin-bottom: 5px; }
        .driver-info p { font-size: 0.8rem; color: #64748b; display: flex; align-items: center; gap: 5px; }
        
        .book-btn {
            background: #10b981; color: white; border: none; padding: 8px 15px;
            border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.85rem;
        }
        .book-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

        /* حالات الحجز */
        .status-badge { padding: 5px 10px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; }
        .status-pending { background: #fef3c7; color: #d97706; }
        .status-accepted { background: #d1fae5; color: #059669; }
        .status-rejected { background: #fee2e2; color: #dc2626; }

        /* نافذة تأكيد الحجز */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 3000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; padding: 20px; border-radius: 20px; width: 100%; max-width: 350px; text-align: center; }
        .modal-content h3 { color: #1e3a8a; margin-bottom: 10px; }
        .modal-content p { font-size: 0.9rem; color: #64748b; margin-bottom: 20px; }
        .modal-content button { width: 100%; padding: 12px; background: #1e3a8a; color: white; border: none; border-radius: 10px; font-weight: bold; font-family: 'Cairo'; cursor: pointer; margin-bottom: 10px;}
        .modal-content .btn-cancel { background: #e2e8f0; color: #333; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="welcome-bar" id="welcomeBar" style="display: none;">
        <i class="fas fa-user-graduate"></i> أهلاً، <span id="stdNameDisplay"></span>
    </div>

    <!-- القائمة السفلية المشتركة (للسائقين أو الحجوزات) -->
    <div class="bottom-sheet" id="mainSheet">
        <div class="sheet-header">
            <h2 id="sheetTitle"><i class="fas fa-bus"></i> السائقون المتاحون</h2>
            <button class="close-btn" onclick="closeSheet()"><i class="fas fa-times"></i></button>
        </div>
        
        <!-- فلتر المناطق (يظهر فقط في قسم السائقين) -->
        <div class="filter-box" id="areaFilterBox">
            <select id="areaSelect" onchange="renderDrivers()">
                <option value="all">كل المناطق</option>
                <!-- سيتم تعبئتها ديناميكياً -->
            </select>
        </div>

        <div class="list-container" id="listContainer">
            <p style="text-align:center; color:#666; margin-top:20px;">جاري التحميل...</p>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-map" onclick="closeSheet()">
            <i class="fas fa-map"></i> الخريطة
        </div>
        <div class="nav-item" id="nav-drivers" onclick="openDriversList()">
            <i class="fas fa-bus"></i> السائقين
        </div>
        <div class="nav-item" id="nav-bookings" onclick="openMyBookings()">
            <i class="fas fa-ticket-alt"></i> حجوزاتي
        </div>
        <!-- زر تجربة السائق -->
        <div class="nav-item test-driver" onclick="window.location.href='Driver.html'">
            <i class="fas fa-user-tie"></i> تجربة
        </div>
    </div>

    <!-- نافذة تأكيد الحجز -->
    <div class="modal" id="bookingModal">
        <div class="modal-content">
            <h3><i class="fas fa-ticket-alt"></i> تأكيد الحجز</h3>
            <p>خط: <span id="modalArea"></span><br>سيتم إرسال طلبك للسائق.</p>
            <button onclick="confirmBooking()">تأكيد وإرسال الموقع</button>
            <button class="btn-cancel" onclick="document.getElementById('bookingModal').style.display='none'">إلغاء</button>
        </div>
    </div>

    <script>
        // 1. إعداد الخريطة
        const map = L.map('map', { zoomControl: false }).setView([33.2765, 44.3380], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.control.zoom({ position: 'topright' }).addTo(map);

        const busIcon = L.divIcon({
            className: 'custom-bus-icon',
            html: '<div style="background:#1e3a8a; color:white; border-radius:50%; width:35px; height:35px; display:flex; align-items:center; justify-content:center; border:3px solid white; box-shadow:0 4px 10px rgba(0,0,0,0.3);"><i class="fas fa-bus"></i></div>',
            iconSize: [35, 35], iconAnchor: [17, 17]
        });

        const userIcon = L.divIcon({
            className: 'user-icon',
            html: '<div style="background:#3b82f6; border:3px solid white; border-radius:50%; width:20px; height:20px; box-shadow:0 0 10px rgba(59,130,246,0.8);"></div>',
            iconSize: [20, 20], iconAnchor: [10, 10]
        });

        let userMarker = null;
        let studentLocation = null;
        let selectedDriverPhone = null;
        let currentStudent = null;
        let allDrivers = []; // لحفظ السائقين للفلترة

        // 2. إعداد Supabase (ضع المفاتيح هنا)
        const SUPABASE_URL = "ضع_رابط_المشروع_هنا";
        const SUPABASE_KEY = "ضع_المفتاح_anon_هنا";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 3. جلب بيانات الطالب
        async function loadStudentData() {
            const urlParams = new URLSearchParams(window.location.search);
            const regId = urlParams.get('reg_id');
            if (!regId) return; // تجاهل إذا لم يوجد

            const { data, error } = await sb.from('students').select('*').eq('reg_id', regId).single();
            if (data) {
                currentStudent = data;
                document.getElementById('stdNameDisplay').textContent = data.name;
                document.getElementById('welcomeBar').style.display = 'flex';
            }
        }

        // 4. تحديد الموقع
        function locateStudent() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    studentLocation = { lat, lng };
                    if (userMarker) userMarker.setLatLng([lat, lng]);
                    else userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map).bindPopup("موقعك");
                    // لا نجعلها تطير للموقع فوراً حتى لا تزعج المستخدم، لكن نضع النقطة فقط.
                },
                (err) => { console.log("GPS Error"); },
                { enableHighAccuracy: true }
            );
        }

        // 5. إدارة الواجهة (شريط التنقل)
        function setActiveNav(id) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(id !== 'test') document.getElementById(id).classList.add('active');
        }

        function closeSheet() {
            document.getElementById('mainSheet').classList.remove('open');
            setActiveNav('nav-map');
        }

        // 6. قسم السائقين
        async function openDriversList() {
            setActiveNav('nav-drivers');
            document.getElementById('sheetTitle').innerHTML = '<i class="fas fa-bus"></i> السائقون المتاحون';
            document.getElementById('areaFilterBox').style.display = 'block';
            document.getElementById('mainSheet').classList.add('open');
            document.getElementById('listContainer').innerHTML = '<p style="text-align:center; color:#666;">جاري التحميل...</p>';
            
            // جلب السائقين
            const { data } = await sb.from('routes').select('*').eq('active', true);
            allDrivers = data || [];
            
            // تعبئة فلتر المناطق
            const areas = [...new Set(allDrivers.map(d => d.area))];
            const select = document.getElementById('areaSelect');
            select.innerHTML = '<option value="all">كل المناطق</option>' + areas.map(a => `<option value="${a}">${a}</option>`).join('');

            renderDrivers();
        }

        function renderDrivers() {
            const filter = document.getElementById('areaSelect').value;
            const filtered = filter === 'all' ? allDrivers : allDrivers.filter(d => d.area === filter);
            const list = document.getElementById('listContainer');

            if (filtered.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#666;">لا يوجد سائقون في هذه المنطقة.</p>';
                return;
            }

            list.innerHTML = filtered.map(route => `
                <div class="driver-card">
                    <div class="driver-info">
                        <h3><i class="fas fa-user-tie"></i> ${route.driver_name}</h3>
                        <p><i class="fas fa-car"></i> ${route.car || 'غير محدد'} | <i class="fas fa-map-marker-alt"></i> ${route.area}</p>
                        <p><i class="fas fa-users"></i> ${route.available_seats} مقاعد فارغة</p>
                    </div>
                    <button class="book-btn" onclick="openModal('${route.driver_phone}', '${route.area}')" ${route.available_seats <= 0 ? 'disabled' : ''}>
                        ${route.available_seats <= 0 ? 'مكتمل' : 'حجز'}
                    </button>
                </div>
            `).join('');
        }

        // 7. قسم حجوزاتي
        async function openMyBookings() {
            if (!currentStudent) return alert("يرجى تسجيل الدخول أولاً (رقم التسجيل مفقود).");
            setActiveNav('nav-bookings');
            document.getElementById('sheetTitle').innerHTML = '<i class="fas fa-ticket-alt"></i> سجل حجوزاتي';
            document.getElementById('areaFilterBox').style.display = 'none'; // إخفاء الفلتر
            document.getElementById('mainSheet').classList.add('open');
            document.getElementById('listContainer').innerHTML = '<p style="text-align:center; color:#666;">جاري التحميل...</p>';

            const { data } = await sb.from('bookings')
                .select('*, routes(driver_name, area)')
                .eq('student_reg_id', currentStudent.reg_id)
                .order('created_at', { ascending: false });

            const list = document.getElementById('listContainer');
            if (!data || data.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#666; margin-top:20px;">ليس لديك أي حجوزات سابقة.</p>';
                return;
            }

            list.innerHTML = data.map(b => {
                let statusText = "قيد الانتظار", statusClass = "status-pending";
                if (b.status === 'accepted') { statusText = "مقبول"; statusClass = "status-accepted"; }
                if (b.status === 'rejected') { statusText = "مرفوض"; statusClass = "status-rejected"; }

                return `
                <div class="driver-card" style="flex-direction: column; align-items: flex-start;">
                    <div style="width:100%; display:flex; justify-content:space-between; margin-bottom:5px;">
                        <h3 style="font-size:1rem; color:#1e3a8a;">خط ${b.routes?.area || 'غير محدد'}</h3>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                    <p style="font-size:0.85rem; color:#64748b;">السائق: ${b.routes?.driver_name || 'غير معروف'}</p>
                    <p style="font-size:0.75rem; color:#94a3b8; margin-top:5px;">تاريخ الطلب: ${new Date(b.created_at).toLocaleString('ar-IQ')}</p>
                </div>`;
            }).join('');
        }

        // 8. إتمام الحجز
        function openModal(phone, area) {
            selectedDriverPhone = phone;
            document.getElementById('modalArea').textContent = area;
            document.getElementById('bookingModal').style.display = 'flex';
        }

        async function confirmBooking() {
            document.getElementById('bookingModal').style.display = 'none';
            if (!currentStudent) return alert("خطأ في بيانات الطالب.");

            const { error } = await sb.from('bookings').insert([{
                driver_phone: selectedDriverPhone,
                student_reg_id: currentStudent.reg_id,
                student_name: currentStudent.name,
                student_lat: studentLocation ? studentLocation.lat : null,
                student_lng: studentLocation ? studentLocation.lng : null,
                status: 'pending'
            }]);

            if (error) alert('حدث خطأ: ' + error.message);
            else alert('✅ تم إرسال طلب الحجز بنجاح!');
        }

        // 9. تتبع الباصات
        const busMarkers = {};
        async function loadLiveBuses() {
            const { data } = await sb.from('live_buses').select('*');
            (data || []).forEach(drawBus);
            sb.channel('live_buses_channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'live_buses' }, payload => {
                    if (payload.eventType === 'DELETE') {
                        if (busMarkers[payload.old.driver_phone]) {
                            map.removeLayer(busMarkers[payload.old.driver_phone]);
                            delete busMarkers[payload.old.driver_phone];
                        }
                    } else { drawBus(payload.new); }
                }).subscribe();
        }

        function drawBus(bus) {
            if (!bus?.lat || !bus?.lng) return;
            if (busMarkers[bus.driver_phone]) {
                busMarkers[bus.driver_phone].setLatLng([bus.lat, bus.lng]);
            } else {
                busMarkers[bus.driver_phone] = L.marker([bus.lat, bus.lng], { icon: busIcon }).addTo(map)
                    .bindPopup(`<b>كابتن ${bus.driver_name}</b><br>خط ${bus.area}`);
            }
        }

        // التشغيل
        document.addEventListener('DOMContentLoaded', () => {
            loadStudentData(); 
            locateStudent();
            loadLiveBuses();
        });
    </script>
</body>
</html>
