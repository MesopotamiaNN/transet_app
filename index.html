<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خطوط النقل - جامعة الناجي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body, html { height: 100%; overflow: hidden; background: #e5e7eb; }
        
        /* تأكيد ظهور الخريطة */
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .fab-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: #1e3a8a; color: white;
            padding: 12px 25px; border-radius: 50px; font-weight: 900; font-size: 1rem;
            box-shadow: 0 10px 25px rgba(30,58,138,0.4); border: none; cursor: pointer;
            display: flex; align-items: center; gap: 10px;
        }

        .bottom-sheet {
            position: absolute; bottom: -100%; left: 0; width: 100%; height: 60%;
            background: white; z-index: 2000; border-radius: 25px 25px 0 0;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.1); transition: bottom 0.3s ease-in-out;
            display: flex; flex-direction: column;
        }
        .bottom-sheet.open { bottom: 0; }
        
        .sheet-header { padding: 15px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .sheet-header h2 { font-size: 1.2rem; color: #1e3a8a; font-weight: 900; }
        .close-btn { background: #f1f5f9; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; color: #333; }

        .drivers-list { padding: 15px; overflow-y: auto; flex: 1; }
        .driver-card {
            background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 15px;
            padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .driver-info h3 { font-size: 1rem; color: #1f2937; margin-bottom: 5px; }
        .driver-info p { font-size: 0.8rem; color: #64748b; display: flex; align-items: center; gap: 5px; }
        
        .book-btn {
            background: #10b981; color: white; border: none; padding: 8px 15px;
            border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.85rem;
        }
        .book-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 3000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; padding: 20px; border-radius: 20px; width: 100%; max-width: 350px; text-align: center; }
        .modal-content h3 { color: #1e3a8a; margin-bottom: 10px; }
        .modal-content p { font-size: 0.9rem; color: #64748b; margin-bottom: 20px; }
        .modal-content button { width: 100%; padding: 12px; background: #1e3a8a; color: white; border: none; border-radius: 10px; font-weight: bold; font-family: 'Cairo'; cursor: pointer; }
    </style>
</head>
<body>

    <div id="map"></div>

    <button class="fab-btn" onclick="toggleSheet()">
        <i class="fas fa-list"></i> عرض السائقين
    </button>

    <div class="bottom-sheet" id="driverSheet">
        <div class="sheet-header">
            <h2><i class="fas fa-bus"></i> السائقون المتاحون</h2>
            <button class="close-btn" onclick="toggleSheet()"><i class="fas fa-times"></i></button>
        </div>
        <div class="drivers-list" id="driversList">
            <p style="text-align:center; color:#666; margin-top:20px;">جاري التحميل...</p>
        </div>
    </div>

    <div class="modal" id="bookingModal">
        <div class="modal-content">
            <h3><i class="fas fa-ticket-alt"></i> تأكيد الحجز</h3>
            <p>خط: <span id="modalArea"></span><br>سيتم إرسال طلبك للسائق.</p>
            <button onclick="confirmBooking()">تأكيد وإرسال الموقع</button>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════
        // 1. إعداد الخريطة أولاً (حتى لو فشل الاتصال بقاعدة البيانات)
        // ═══════════════════════════════════════════════════════
        const map = L.map('map', { zoomControl: false }).setView([33.2765, 44.3380], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.control.zoom({ position: 'topright' }).addTo(map);
        L.marker([33.2765, 44.3380]).addTo(map).bindPopup("<b>جامعة الناجي</b>");

        const busIcon = L.divIcon({
            className: 'custom-bus-icon',
            html: '<div style="background:#1e3a8a; color:white; border-radius:50%; width:35px; height:35px; display:flex; align-items:center; justify-content:center; border:3px solid white; box-shadow:0 4px 10px rgba(0,0,0,0.3);"><i class="fas fa-bus"></i></div>',
            iconSize: [35, 35], iconAnchor: [17, 17]
        });

        // ═══════════════════════════════════════════════════════
        // 2. إعداد Supabase
        // ═══════════════════════════════════════════════════════
        const SUPABASE_URL = "ضع_رابط_المشروع_هنا";
        const SUPABASE_KEY = "ضع_المفتاح_anon_هنا";
        
        let sb = null;
        let studentLocation = null;
        let selectedDriverPhone = null;

        try {
            sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {
            console.error("خطأ في Supabase:", e);
            document.getElementById('driversList').innerHTML = '<p style="color:red; text-align:center;">لم يتم ربط قاعدة البيانات. تأكد من مفاتيح Supabase.</p>';
        }

        function toggleSheet() {
            document.getElementById('driverSheet').classList.toggle('open');
        }

        // 3. جلب السائقين
        async function loadDrivers() {
            if(!sb) return;
            const { data, error } = await sb.from('routes').select('*').eq('active', true);
            const list = document.getElementById('driversList');
            
            if (error || !data || data.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#666;">لا يوجد سائقون متاحون حالياً.</p>';
                return;
            }

            list.innerHTML = data.map(route => `
                <div class="driver-card">
                    <div class="driver-info">
                        <h3><i class="fas fa-user-tie"></i> ${route.driver_name}</h3>
                        <p><i class="fas fa-car"></i> ${route.car || 'غير محدد'} | <i class="fas fa-users"></i> ${route.available_seats} مقاعد</p>
                    </div>
                    <button class="book-btn" onclick="openModal('${route.driver_phone}', '${route.area}')" ${route.available_seats <= 0 ? 'disabled' : ''}>
                        ${route.available_seats <= 0 ? 'مكتمل' : 'حجز'}
                    </button>
                </div>
            `).join('');
        }

        // 4. الحجز
        function openModal(phone, area) {
            selectedDriverPhone = phone;
            document.getElementById('modalArea').textContent = area;
            document.getElementById('bookingModal').style.display = 'flex';
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => { studentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude }; },
                    err => { console.log("لم يتم جلب الموقع"); }
                );
            }
        }

        async function confirmBooking() {
            document.getElementById('bookingModal').style.display = 'none';
            if(!sb) return alert("قاعدة البيانات غير مربوطة");

            const { error } = await sb.from('bookings').insert([{
                driver_phone: selectedDriverPhone,
                student_id: "2023-XXXX", // ضع رقم الطالب هنا
                student_name: "طالب",    // ضع اسم الطالب هنا
                student_lat: studentLocation ? studentLocation.lat : null,
                student_lng: studentLocation ? studentLocation.lng : null,
                status: 'pending'
            }]);

            if (error) alert('حدث خطأ: ' + error.message);
            else alert('✅ تم إرسال طلب الحجز بنجاح!');
        }

        // 5. التتبع الحي
        const busMarkers = {};
        async function loadLiveBuses() {
            if(!sb) return;
            const { data } = await sb.from('live_buses').select('*');
            (data || []).forEach(drawBus);

            sb.channel('live_buses_channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'live_buses' }, payload => {
                    if (payload.eventType === 'DELETE') {
                        if (busMarkers[payload.old.driver_phone]) {
                            map.removeLayer(busMarkers[payload.old.driver_phone]);
                            delete busMarkers[payload.old.driver_phone];
                        }
                    } else { drawBus(payload.new); }
                }).subscribe();
        }

        function drawBus(bus) {
            if (!bus?.lat || !bus?.lng) return;
            if (busMarkers[bus.driver_phone]) {
                busMarkers[bus.driver_phone].setLatLng([bus.lat, bus.lng]);
            } else {
                busMarkers[bus.driver_phone] = L.marker([bus.lat, bus.lng], { icon: busIcon }).addTo(map)
                    .bindPopup(`<b>كابتن ${bus.driver_name}</b><br>خط ${bus.area}`);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadDrivers();
            loadLiveBuses();
        });
    </script>
</body>
</html>
