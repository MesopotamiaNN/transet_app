<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>خطوط النقل - جامعة الناجي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e3a8a; --primary-light: #3b82f6; --accent: #8b5cf6;
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
            --bg: #f0f4ff; --white: #ffffff; --text: #1f2937; --text-muted: #64748b;
            --shadow-sm: 0 4px 6px rgba(0,0,0,0.05);
            --shadow-md: 0 10px 25px rgba(0,0,0,0.1);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.15);
            --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; overflow: hidden; background: var(--bg); }
        
        /* خريطة أنيقة (Carto Voyager) */
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #e5e7eb; }

        .welcome-bar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 10px 25px; border-radius: 50px; box-shadow: var(--shadow-md);
            font-weight: 800; color: var(--primary); display: none; align-items: center; gap: 10px;
            font-size: 0.95rem; white-space: nowrap; border: 1px solid rgba(255,255,255,0.8);
            animation: slideDown 0.5s var(--spring);
        }
        @keyframes slideDown { from { top: -50px; } to { top: 20px; } }

        .locate-btn {
            position: absolute; bottom: 100px; right: 20px; z-index: 1000;
            background: var(--white); color: var(--primary); width: 52px; height: 52px; border-radius: 50%;
            border: none; box-shadow: var(--shadow-md); font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.3s var(--spring);
        }
        .locate-btn:active { transform: scale(0.85); }

        .bottom-nav {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 400px; height: 68px; background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 2000; border-radius: 24px;
            box-shadow: var(--shadow-lg); display: flex; justify-content: space-around; align-items: center;
            border: 1px solid rgba(255,255,255,0.6); padding: 0 10px;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 0.75rem; font-weight: 800; cursor: pointer;
            width: 25%; height: 100%; transition: 0.3s var(--spring);
        }
        .nav-item i { font-size: 1.4rem; margin-bottom: 4px; transition: 0.3s var(--spring); }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-3px) scale(1.1); }
        .nav-item.test-driver { color: var(--danger); }

        .bottom-sheet {
            position: absolute; bottom: -100%; left: 0; width: 100%; height: 75%;
            background: var(--white); z-index: 1500; border-radius: 32px 32px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.15); transition: bottom 0.4s var(--spring);
            display: flex; flex-direction: column;
        }
        .bottom-sheet.open { bottom: 0; }
        
        .drag-handle { width: 45px; height: 6px; background: #cbd5e1; border-radius: 10px; margin: 12px auto 5px; }
        .sheet-header { padding: 10px 25px 15px; display: flex; justify-content: space-between; align-items: center; }
        .sheet-header h2 { font-size: 1.2rem; color: var(--text); font-weight: 900; }
        .close-btn { background: #f1f5f9; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }

        .filter-box { padding: 0 25px 15px; }
        .filter-box select { width: 100%; padding: 12px 15px; border-radius: 14px; border: 2px solid #e2e8f0; font-family: 'Cairo'; font-weight: 700; color: var(--primary); outline: none; background: #f8fafc; appearance: none; }

        .list-container { padding: 0 20px 100px 20px; overflow-y: auto; flex: 1; }
        .list-container::-webkit-scrollbar { display: none; }

        /* كرت السائق */
        .driver-card { background: var(--white); border: 1px solid #f1f5f9; border-radius: 20px; padding: 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm); transition: 0.2s; }
        .driver-card:active { transform: scale(0.98); }
        .driver-avatar { width: 45px; height: 45px; background: rgba(59, 130, 246, 0.1); color: var(--primary-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-left: 15px; }
        .driver-info { flex: 1; }
        .driver-info h3 { font-size: 1.05rem; color: var(--text); margin-bottom: 4px; font-weight: 900; }
        .driver-info p { font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; margin-bottom: 2px; font-weight: 600; }
        
        .book-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 14px; font-weight: 800; cursor: pointer; font-size: 0.9rem; transition: 0.3s; box-shadow: 0 4px 10px rgba(30,58,138,0.2); }
        .book-btn:active { transform: scale(0.9); }
        .book-btn:disabled { background: #e2e8f0; color: #94a3b8; box-shadow: none; cursor: not-allowed; }

        /* Skeleton Loader */
        .skeleton-card { background: #f1f5f9; border-radius: 20px; height: 85px; margin-bottom: 12px; animation: shimmer 1.5s infinite linear; background-image: linear-gradient(to right, #f1f5f9 0%, #e2e8f0 20%, #f1f5f9 40%, #f1f5f9 100%); background-size: 800px 100%; }
        @keyframes shimmer { 0% { background-position: -468px 0; } 100% { background-position: 468px 0; } }

        /* Toasts */
        #toastContainer { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 5000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 350px; pointer-events: none; }
        .toast { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 15px 20px; border-radius: 16px; box-shadow: var(--shadow-lg); font-weight: 800; font-size: 0.9rem; display: flex; align-items: center; gap: 12px; transform: translateY(-30px); opacity: 0; transition: 0.4s var(--spring); border-right: 5px solid var(--primary); }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-right-color: var(--success); }
        .toast.error { border-right-color: var(--danger); }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(5px); z-index: 3000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--white); padding: 30px 25px; border-radius: 30px; width: 100%; max-width: 360px; text-align: center; transform: scale(0.8); transition: 0.4s var(--spring); }
        .modal.show .modal-content { transform: scale(1); }
        .modal-icon { width: 70px; height: 70px; background: rgba(16,185,129,0.1); color: var(--success); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 15px; }
        .modal-content h3 { color: var(--text); margin-bottom: 10px; font-size: 1.3rem; font-weight: 900; }
        .modal-content p { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 25px; font-weight: 600; }
        .modal-content button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 16px; font-weight: 800; font-family: 'Cairo'; font-size: 1rem; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(30,58,138,0.3); transition: 0.2s; }
        .modal-content button:active { transform: scale(0.95); }
        .modal-content .btn-cancel { background: #f1f5f9; color: var(--text-muted); box-shadow: none; }

        /* حالة فارغة */
        .empty-state { text-align: center; margin-top: 50px; }
        .empty-state i { font-size: 4rem; color: #cbd5e1; margin-bottom: 15px; }
        .empty-state p { color: var(--text-muted); font-weight: 800; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="welcome-bar" id="welcomeBar">
        <i class="fas fa-user-graduate" style="color: var(--accent);"></i> أهلاً، <span id="stdNameDisplay"></span>
    </div>

    <button class="locate-btn" onclick="locateStudent()"><i class="fas fa-crosshairs"></i></button>

    <div class="bottom-sheet" id="mainSheet">
        <div class="drag-handle"></div>
        <div class="sheet-header">
            <h2 id="sheetTitle">السائقون المتاحون</h2>
            <button class="close-btn" onclick="closeSheet()"><i class="fas fa-times"></i></button>
        </div>
        <div class="filter-box" id="areaFilterBox">
            <select id="areaSelect" onchange="renderDrivers()"><option value="all">📍 كل المناطق</option></select>
        </div>
        <div class="list-container" id="listContainer"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" id="nav-map" onclick="closeSheet()"><i class="fas fa-map-marked-alt"></i> الخريطة</div>
        <div class="nav-item" id="nav-drivers" onclick="openDriversList()"><i class="fas fa-bus-alt"></i> السائقين</div>
        <div class="nav-item" id="nav-bookings" onclick="openMyBookings()"><i class="fas fa-ticket-alt"></i> حجوزاتي</div>
        <div class="nav-item test-driver" onclick="window.location.href='Driver.html'"><i class="fas fa-user-tie"></i> تجربة</div>
    </div>

    <div class="modal" id="bookingModal">
        <div class="modal-content">
            <div class="modal-icon"><i class="fas fa-check"></i></div>
            <h3>تأكيد الحجز</h3>
            <p>خط: <strong id="modalArea" style="color:var(--primary);"></strong><br>هل أنت متأكد من طلب الحجز؟</p>
            <button onclick="confirmBooking()">نعم، احجز مقعدي</button>
            <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>
        // 1. خريطة CartoDB Voyager (أجمل وأوضح)
        const map = L.map('map', { zoomControl: false }).setView([33.2765, 44.3380], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains: 'abcd', maxZoom: 20
        }).addTo(map);
        L.control.zoom({ position: 'topright' }).addTo(map);

        // أيقونات متحركة
        const busIcon = L.divIcon({ 
            className: 'custom-bus-icon', 
            html: '<div class="bus-pulse" style="background:#1e3a8a; color:white; border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center; border:3px solid white; box-shadow:0 4px 10px rgba(0,0,0,0.3);"><i class="fas fa-bus" style="font-size:14px;"></i></div>', 
            iconSize: [36, 36], iconAnchor: [18, 18] 
        });
        const userIcon = L.divIcon({ 
            className: 'user-icon', 
            html: '<div style="background:#3b82f6; border:3px solid white; border-radius:50%; width:22px; height:22px; box-shadow:0 0 15px rgba(59,130,246,0.8);"></div>', 
            iconSize: [22, 22], iconAnchor: [11, 11] 
        });

        let userMarker = null, studentLocation = null, selectedDriverPhone = null, allDrivers = [];
        
        const SUPABASE_URL = "https://ewivzdrrujuwhkuqqgei.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3aXZ6ZHJydWp1d2hrdXFxZ2VpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1OTMwNDQsImV4cCI6MjEwNTE2OTA0NH0.ng8N-08Pl2SOr42Dw01fLSG6n8C17BNTG5XDVPdisM8";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentStudent = { reg_id: 'TEST-123', name: 'طالب تجريبي' }; 

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}" style="color:${type === 'success' ? 'var(--success)' : 'var(--danger)'}; font-size:1.2rem;"></i> <span>${message}</span>`;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3500);
        }

        async function loadStudentData() {
            const regId = new URLSearchParams(window.location.search).get('reg_id');
            if (regId && sb) {
                const { data } = await sb.from('students').select('*').eq('reg_id', regId).single();
                if (data) currentStudent = data;
            }
            document.getElementById('stdNameDisplay').textContent = currentStudent.name;
            document.getElementById('welcomeBar').style.display = 'flex';
        }

        function locateStudent() {
            if (!navigator.geolocation) return showToast("جهازك لا يدعم تحديد الموقع", "error");
            const btn = document.querySelector('.locate-btn i');
            btn.className = 'fas fa-circle-notch fa-spin';

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    studentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    if (userMarker) userMarker.setLatLng([studentLocation.lat, studentLocation.lng]);
                    else userMarker = L.marker([studentLocation.lat, studentLocation.lng], { icon: userIcon }).addTo(map).bindPopup("<b>موقعك الحالي</b>");
                    map.flyTo([studentLocation.lat, studentLocation.lng], 16, { animate: true, duration: 1.5 });
                    btn.className = 'fas fa-crosshairs';
                    showToast("تم تحديد موقعك بنجاح");
                },
                (err) => { showToast("تعذر تحديد الموقع", "error"); btn.className = 'fas fa-crosshairs'; },
                { enableHighAccuracy: true }
            );
        }

        function setActiveNav(id) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(id !== 'test') document.getElementById(id).classList.add('active');
        }

        function closeSheet() { document.getElementById('mainSheet').classList.remove('open'); setActiveNav('nav-map'); }
        function closeModal() { document.getElementById('bookingModal').classList.remove('show'); setTimeout(() => { document.getElementById('bookingModal').style.display = 'none'; }, 400); }

        async function openDriversList() {
            setActiveNav('nav-drivers');
            document.getElementById('sheetTitle').innerHTML = 'السائقون المتاحون';
            document.getElementById('areaFilterBox').style.display = 'block';
            document.getElementById('mainSheet').classList.add('open');
            
            // Skeleton Loader
            document.getElementById('listContainer').innerHTML = Array(3).fill('<div class="skeleton-card"></div>').join('');
            
            const { data } = await sb.from('routes').select('*').eq('active', true);
            allDrivers = data || [];
            const areas = [...new Set(allDrivers.map(d => d.area))];
            document.getElementById('areaSelect').innerHTML = '<option value="all">📍 كل المناطق</option>' + areas.map(a => `<option value="${a}">${a}</option>`).join('');
            renderDrivers();
        }

        function renderDrivers() {
            const filter = document.getElementById('areaSelect').value;
            const filtered = filter === 'all' ? allDrivers : allDrivers.filter(d => d.area === filter);
            const list = document.getElementById('listContainer');

            if (filtered.length === 0) return list.innerHTML = '<div class="empty-state"><i class="fas fa-bus-slash"></i><p>لا يوجد سائقون متاحون حالياً</p></div>';

            list.innerHTML = filtered.map(route => `
                <div class="driver-card">
                    <div class="driver-avatar"><i class="fas fa-user-tie"></i></div>
                    <div class="driver-info">
                        <h3>${route.driver_name}</h3>
                        <p><i class="fas fa-car" style="color:var(--primary-light);"></i> ${route.car || 'سيارة'}</p>
                        <p><i class="fas fa-map-marker-alt" style="color:var(--danger);"></i> ${route.area} &nbsp;|&nbsp; <i class="fas fa-chair" style="color:var(--warning);"></i> ${route.available_seats} مقاعد</p>
                    </div>
                    <button class="book-btn" onclick="openModal('${route.driver_phone}', '${route.area}')" ${route.available_seats <= 0 ? 'disabled' : ''}>${route.available_seats <= 0 ? 'مكتمل' : 'حجز'}</button>
                </div>
            `).join('');
        }

        async function openMyBookings() {
            setActiveNav('nav-bookings');
            document.getElementById('sheetTitle').innerHTML = 'سجل حجوزاتي';
            document.getElementById('areaFilterBox').style.display = 'none';
            document.getElementById('mainSheet').classList.add('open');
            document.getElementById('listContainer').innerHTML = Array(2).fill('<div class="skeleton-card"></div>').join('');

            const { data } = await sb.from('bookings').select('*, routes(driver_name, area)').eq('student_reg_id', currentStudent.reg_id).order('created_at', { ascending: false });
            const list = document.getElementById('listContainer');
            
            if (!data || data.length === 0) return list.innerHTML = '<div class="empty-state"><i class="fas fa-ticket-alt"></i><p>ليس لديك أي حجوزات سابقة</p></div>';

            list.innerHTML = data.map(b => {
                let sText = "قيد الانتظار", sClass = "status-pending", sColor = "#d97706";
                if (b.status === 'accepted') { sText = "مقبول"; sClass = "status-accepted"; sColor = "#059669"; }
                if (b.status === 'rejected') { sText = "مرفوض"; sClass = "status-rejected"; sColor = "#dc2626"; }
                return `
                <div class="driver-card" style="flex-direction: column; align-items: flex-start; gap:10px;">
                    <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="font-size:1.1rem; color:var(--primary);">خط ${b.routes?.area || 'غير محدد'}</h3>
                        <span style="padding:5px 12px; border-radius:8px; font-size:0.8rem; font-weight:800; background:${sColor}15; color:${sColor};">${sText}</span>
                    </div>
                    <p style="font-size:0.9rem; color:var(--text-muted);"><i class="fas fa-user-tie"></i> السائق: ${b.routes?.driver_name || 'غير معروف'}</p>
                </div>`;
            }).join('');
        }

        function openModal(phone, area) {
            selectedDriverPhone = phone;
            document.getElementById('modalArea').textContent = area;
            document.getElementById('bookingModal').style.display = 'flex';
            setTimeout(() => document.getElementById('bookingModal').classList.add('show'), 10);
        }

        async function confirmBooking() {
            closeModal();
            const { error } = await sb.from('bookings').insert([{
                driver_phone: selectedDriverPhone, student_reg_id: currentStudent.reg_id, student_name: currentStudent.name,
                student_lat: studentLocation ? studentLocation.lat : null, student_lng: studentLocation ? studentLocation.lng : null, status: 'pending'
            }]);

            if (error) showToast('حدث خطأ أثناء الحجز', 'error');
            else showToast('تم إرسال طلب الحجز بنجاح!', 'success');
        }

        const busMarkers = {};
        async function loadLiveBuses() {
            const { data } = await sb.from('live_buses').select('*');
            (data || []).forEach(drawBus);
            sb.channel('live_buses_channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'live_buses' }, payload => {
                    if (payload.eventType === 'DELETE') {
                        if (busMarkers[payload.old.driver_phone]) { map.removeLayer(busMarkers[payload.old.driver_phone]); delete busMarkers[payload.old.driver_phone]; }
                    } else { drawBus(payload.new); }
                }).subscribe();
        }

        function drawBus(bus) {
            if (!bus?.lat || !bus?.lng) return;
            if (busMarkers[bus.driver_phone]) busMarkers[bus.driver_phone].setLatLng([bus.lat, bus.lng]);
            else busMarkers[bus.driver_phone] = L.marker([bus.lat, bus.lng], { icon: busIcon }).addTo(map).bindPopup(`<b>كابتن ${bus.driver_name}</b><br>خط ${bus.area}`);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadStudentData(); 
            locateStudent();
            loadLiveBuses();
        });
    </script>
</body>
</html>
