<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>خطوط النقل - جامعة الناجي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --primary: #1e3a8a; --primary-light: #3b82f6; --accent: #8b5cf6;
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
            --bg: #f0f4ff; --white: #ffffff; --card-bg: #ffffff;
            --text: #1f2937; --text-muted: #64748b;
            --shadow-sm: 0 4px 6px rgba(0,0,0,0.05);
            --shadow-md: 0 10px 25px rgba(0,0,0,0.1);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.15);
            --nav-bg: rgba(255, 255, 255, 0.85);
            --border-light: #f1f5f9;
            --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body.dark-mode {
            --primary: #3b82f6; --primary-light: #60a5fa; 
            --bg: #0f172a; --white: #1e293b; --card-bg: #1e293b;
            --text: #f8fafc; --text-muted: #94a3b8;
            --shadow-sm: 0 4px 6px rgba(0,0,0,0.3);
            --shadow-md: 0 10px 25px rgba(0,0,0,0.4);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.5);
            --nav-bg: rgba(30, 41, 59, 0.85);
            --border-light: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; overflow: hidden; background: var(--bg); transition: background 0.3s ease; }
        
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #e5e7eb; transition: filter 0.3s ease; }
        body.dark-mode .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        .leaflet-control-attribution { display: none !important; }
        .leaflet-bottom.leaflet-left { bottom: 105px !important; }
        .leaflet-control-zoom { border: none !important; box-shadow: var(--shadow-md) !important; border-radius: 12px !important; overflow: hidden; }
        .leaflet-control-zoom a { background: var(--white) !important; color: var(--text) !important; border-bottom: 1px solid var(--border-light) !important; }

        .top-bar { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; gap: 10px; width: 90%; max-width: 400px; pointer-events: none; }
        .welcome-bar { background: var(--nav-bg); backdrop-filter: blur(20px); padding: 10px 20px; border-radius: 50px; box-shadow: var(--shadow-md); font-weight: 800; color: var(--text); display: none; align-items: center; gap: 8px; font-size: 0.9rem; white-space: nowrap; border: 1px solid var(--border-light); flex: 1; pointer-events: auto; }
        .live-counter { background: var(--success); color: white; padding: 10px 15px; border-radius: 50px; font-weight: 800; font-size: 0.85rem; box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 6px; pointer-events: auto; }

        .map-controls { position: absolute; bottom: 105px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .control-btn { background: var(--white); color: var(--text); width: 50px; height: 50px; border-radius: 50%; border: none; box-shadow: var(--shadow-md); font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s var(--spring); text-decoration: none; }
        .control-btn:active { transform: scale(0.85); }

        .bottom-nav { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 400px; height: 68px; background: var(--nav-bg); backdrop-filter: blur(20px); z-index: 2000; border-radius: 24px; box-shadow: var(--shadow-lg); display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-light); padding: 0 5px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); font-size: 0.7rem; font-weight: 800; cursor: pointer; width: 25%; height: 100%; transition: 0.3s var(--spring); }
        .nav-item i { font-size: 1.3rem; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-3px) scale(1.1); }
        .nav-item.test-driver { color: var(--danger); }
        .nav-item.support { color: #25D366; }

        .bottom-sheet { position: absolute; bottom: -100%; left: 0; width: 100%; height: 75%; background: var(--white); z-index: 1500; border-radius: 32px 32px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); transition: bottom 0.4s var(--spring); display: flex; flex-direction: column; }
        .bottom-sheet.open { bottom: 0; }
        
        .drag-handle { width: 45px; height: 6px; background: #cbd5e1; border-radius: 10px; margin: 12px auto 5px; }
        .sheet-header { padding: 10px 25px 15px; display: flex; justify-content: space-between; align-items: center; }
        .sheet-header h2 { font-size: 1.2rem; color: var(--text); font-weight: 900; }
        .close-btn { background: var(--bg); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; color: var(--text); display: flex; align-items: center; justify-content: center; }

        .search-box { padding: 0 25px 15px; position: relative; }
        .search-box i { position: absolute; right: 40px; top: 15px; color: var(--text-muted); }
        .search-box input { width: 100%; padding: 12px 45px 12px 15px; border-radius: 14px; border: 2px solid var(--border-light); font-family: 'Cairo'; font-weight: 700; color: var(--text); outline: none; background: var(--bg); transition: 0.3s; }
        .search-box input:focus { border-color: var(--primary-light); background: var(--white); }

        .list-container { padding: 0 20px 100px 20px; overflow-y: auto; flex: 1; }
        .list-container::-webkit-scrollbar { display: none; }

        .driver-card { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 20px; padding: 18px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-sm); cursor: pointer; transition: 0.3s; }
        .driver-card:active { transform: scale(0.98); }
        .driver-card.highlight { border-color: var(--primary-light); box-shadow: 0 0 0 2px var(--primary-light); }
        
        .driver-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .driver-avatar { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-left: 15px; }
        .driver-avatar.bus { background: rgba(30, 58, 138, 0.1); color: #1e3a8a; }
        .driver-avatar.car { background: rgba(139, 92, 246, 0.1); color: #8b5cf6; }
        
        .driver-info { flex: 1; }
        .driver-info h3 { font-size: 1.05rem; color: var(--text); margin-bottom: 4px; font-weight: 900; }
        .driver-info p { font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; margin-bottom: 2px; font-weight: 600; }
        
        .distance-badge { background: rgba(139, 92, 246, 0.1); color: var(--accent); padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: left; }
        .distance-eta { font-size: 0.65rem; color: var(--text-muted); background: var(--bg); padding: 2px 6px; border-radius: 6px; width: fit-content; }

        .contact-actions { display: flex; gap: 10px; margin-top: 5px; }
        .btn-call { flex: 1; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 14px; font-weight: 800; font-family: 'Cairo'; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: 0.2s; box-shadow: 0 4px 10px rgba(30,58,138,0.2); }
        .btn-wa { flex: 1; background: #25D366; color: white; border: none; padding: 12px; border-radius: 14px; font-weight: 800; font-family: 'Cairo'; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: 0.2s; box-shadow: 0 4px 10px rgba(37,211,102,0.3); }
        .btn-call:active, .btn-wa:active { transform: scale(0.95); }

        .skeleton-card { background: var(--border-light); border-radius: 20px; height: 160px; margin-bottom: 12px; animation: shimmer 1.5s infinite linear; background-image: linear-gradient(to right, var(--border-light) 0%, var(--bg) 20%, var(--border-light) 40%, var(--border-light) 100%); background-size: 800px 100%; }
        @keyframes shimmer { 0% { background-position: -468px 0; } 100% { background-position: 468px 0; } }

        #toastContainer { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 5000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 350px; pointer-events: none; }
        .toast { background: var(--white); padding: 15px 20px; border-radius: 16px; box-shadow: var(--shadow-lg); font-weight: 800; font-size: 0.9rem; color: var(--text); display: flex; align-items: center; gap: 12px; transform: translateY(-30px); opacity: 0; transition: 0.4s var(--spring); border-right: 5px solid var(--primary); }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.alert { border-right-color: var(--warning); background: #fffbeb; color: #d97706; }
        body.dark-mode .toast.alert { background: #451a03; color: #fcd34d; }

        .empty-state { text-align: center; margin-top: 50px; }
        .empty-state i { font-size: 4rem; color: var(--text-muted); margin-bottom: 15px; opacity: 0.5; }
        .empty-state p { color: var(--text-muted); font-weight: 800; font-size: 1.1rem; }

        .pulse-close .bus-icon-bg { animation: pulse-green 1.5s infinite; background: #10b981 !important; }
        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="top-bar">
        <div class="welcome-bar" id="welcomeBar">
            <i class="fas fa-user-graduate" style="color: var(--accent);"></i> أهلاً، <span id="stdNameDisplay"></span>
        </div>
        <div class="live-counter" id="liveCounter" style="display: none;">
            <i class="fas fa-bus"></i> <span id="busCount">0</span> مباشر
        </div>
    </div>

    <div class="map-controls">
        <button class="control-btn" id="themeToggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
        <button class="control-btn" onclick="locateStudent()"><i class="fas fa-crosshairs"></i></button>
    </div>

    <div class="bottom-sheet" id="mainSheet">
        <div class="drag-handle"></div>
        <div class="sheet-header">
            <h2 id="sheetTitle">السائقون المتاحون</h2>
            <button class="close-btn" onclick="closeSheet()"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="search-box" id="searchBoxContainer">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن منطقة أو اسم سائق..." oninput="renderDrivers()">
        </div>
        
        <div class="list-container" id="listContainer"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" id="nav-map" onclick="closeSheet()"><i class="fas fa-map-marked-alt"></i> الخريطة</div>
        <div class="nav-item" id="nav-drivers" onclick="openDriversList()"><i class="fas fa-bus-alt"></i> السائقين</div>
        <div class="nav-item support" onclick="window.open('https://wa.me/9647700000000', '_blank')"><i class="fab fa-whatsapp"></i> الدعم</div>
        <div class="nav-item test-driver" onclick="window.location.href='Driver.html'"><i class="fas fa-user-tie"></i> تجربة</div>
    </div>

    <div id="toastContainer"></div>

    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
        }
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                localStorage.setItem('theme', 'light');
                themeToggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
            }
        }

        const map = L.map('map', { zoomControl: false }).setView([33.2765, 44.3380], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        const busIcon = L.divIcon({ className: 'custom-bus-icon', html: '<div class="bus-icon-bg" style="background:#1e3a8a; color:white; border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center; border:3px solid white; box-shadow:0 4px 10px rgba(0,0,0,0.3); transition: 0.3s;"><i class="fas fa-bus" style="font-size:14px;"></i></div>', iconSize: [36, 36], iconAnchor: [18, 18] });
        const carIcon = L.divIcon({ className: 'custom-car-icon', html: '<div class="bus-icon-bg" style="background:#8b5cf6; color:white; border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center; border:3px solid white; box-shadow:0 4px 10px rgba(0,0,0,0.3); transition: 0.3s;"><i class="fas fa-car" style="font-size:14px;"></i></div>', iconSize: [36, 36], iconAnchor: [18, 18] });
        const userIcon = L.divIcon({ className: 'user-icon', html: '<div style="background:#3b82f6; border:3px solid white; border-radius:50%; width:22px; height:22px; box-shadow:0 0 15px rgba(59,130,246,0.8);"></div>', iconSize: [22, 22], iconAnchor: [11, 11] });

        let userMarker = null, studentLocation = null, allDrivers = [], liveDrivers = [];
        const busMarkers = {};
        const busPaths = {};
        const notifiedDrivers = new Set();

        const SUPABASE_URL = "https://ewivzdrrujuwhkuqqgei.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3aXZ6ZHJydWp1d2hrdXFxZ2VpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1OTMwNDQsImV4cCI6MjEwNTE2OTA0NH0.ng8N-08Pl2SOr42Dw01fLSG6n8C17BNTG5XDVPdisM8";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentStudent = { reg_id: 'TEST-123', name: 'طالب تجريبي' }; 

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let icon = 'fa-check-circle';
            if(type === 'error') icon = 'fa-exclamation-circle';
            if(type === 'alert') icon = 'fa-bell';
            toast.innerHTML = `<i class="fas ${icon}" style="font-size:1.2rem;"></i> <span>${message}</span>`;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 5000);
        }

        async function loadStudentData() {
            const regId = new URLSearchParams(window.location.search).get('reg_id');
            if (regId && sb) {
                const { data } = await sb.from('students').select('*').eq('reg_id', regId).single();
                if (data) currentStudent = data;
            }
            document.getElementById('stdNameDisplay').textContent = currentStudent.name;
            document.getElementById('welcomeBar').style.display = 'flex';
        }

        function locateStudent() {
            if (!navigator.geolocation) return showToast("جهازك لا يدعم تحديد الموقع", "error");
            const btn = document.querySelectorAll('.control-btn')[1].querySelector('i');
            btn.className = 'fas fa-circle-notch fa-spin';

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    studentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    if (userMarker) userMarker.setLatLng([studentLocation.lat, studentLocation.lng]);
                    else userMarker = L.marker([studentLocation.lat, studentLocation.lng], { icon: userIcon, zIndexOffset: 1000 }).addTo(map).bindPopup("<b>موقعك الحالي</b>");
                    map.flyTo([studentLocation.lat, studentLocation.lng], 16, { animate: true, duration: 1.5 });
                    btn.className = 'fas fa-crosshairs';
                    showToast("تم تحديد موقعك بنجاح");
                    if(document.getElementById('mainSheet').classList.contains('open')) renderDrivers();
                    fetchLiveBuses();
                },
                (err) => { showToast("تعذر تحديد الموقع", "error"); btn.className = 'fas fa-crosshairs'; },
                { enableHighAccuracy: true }
            );
        }

        function setActiveNav(id) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(id !== 'test' && id !== 'support') document.getElementById(id).classList.add('active');
        }

        function closeSheet() { document.getElementById('mainSheet').classList.remove('open'); setActiveNav('nav-map'); }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            if(!lat1 || !lon1 || !lat2 || !lon2) return null;
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return (R * c).toFixed(1);
        }

        async function openDriversList() {
            setActiveNav('nav-drivers');
            document.getElementById('mainSheet').classList.add('open');
            document.getElementById('searchBoxContainer').style.display = 'block';
            document.getElementById('listContainer').innerHTML = Array(3).fill('<div class="skeleton-card"></div>').join('');
            
            const { data } = await sb.from('routes').select('*').eq('active', true);
            allDrivers = data || [];
            renderDrivers();
        }

        function renderDrivers() {
            const searchQ = document.getElementById('searchInput').value.trim().toLowerCase();
            
            let displayDrivers = allDrivers.map(route => {
                const live = liveDrivers.find(l => l.driver_phone === route.driver_phone);
                let distance = null;
                if (live && studentLocation) {
                    distance = parseFloat(calculateDistance(studentLocation.lat, studentLocation.lng, live.lat, live.lng));
                }
                return { ...route, liveData: live, distance: distance };
            });

            if (searchQ) {
                displayDrivers = displayDrivers.filter(d => 
                    (d.driver_name && d.driver_name.toLowerCase().includes(searchQ)) || 
                    (d.area && d.area.toLowerCase().includes(searchQ))
                );
            }

            displayDrivers.sort((a, b) => {
                if (a.distance === null) return 1;
                if (b.distance === null) return -1;
                return a.distance - b.distance;
            });

            const list = document.getElementById('listContainer');
            if (displayDrivers.length === 0) return list.innerHTML = '<div class="empty-state"><i class="fas fa-bus-slash"></i><p>لا يوجد سائقون يطابقون بحثك</p></div>';

            list.innerHTML = displayDrivers.map(route => {
                const cleanPhone = route.driver_phone.replace(/\s+/g, '');
                const waPhone = cleanPhone.startsWith('0') ? '964' + cleanPhone.substring(1) : '964' + cleanPhone;
                const waMessage = encodeURIComponent(`مرحباً كابتن ${route.driver_name}، أنا طالب من جامعة الناجي. هل لديك مقعد شاغر في خط (${route.area})؟`);
                
                let etaText = '';
                let distanceText = '';
                
                if (route.distance !== null) {
                    const etaMinutes = Math.ceil((route.distance / 30) * 60);
                    distanceText = `<i class="fas fa-location-arrow"></i> ${route.distance} كم`;
                    etaText = etaMinutes <= 1 ? `<span class="distance-eta" style="color:var(--success); font-weight:900;">وصل الآن</span>` : `<span class="distance-eta">وصول بعد ${etaMinutes} دقيقة</span>`;
                } else {
                    distanceText = `غير متصل`;
                }
                
                const distanceHTML = `<div class="distance-badge">${distanceText} ${etaText}</div>`;
                const isLive = route.liveData ? 'border-right: 4px solid var(--success);' : '';
                const isBus = route.vehicle_type === 'bus';
                const typeIcon = isBus ? 'fa-bus' : 'fa-car';
                const typeClass = isBus ? 'bus' : 'car';

                return `
                <div class="driver-card" id="card_${cleanPhone}" style="${isLive}" onclick="focusOnDriver('${cleanPhone}', ${route.liveData?.lat}, ${route.liveData?.lng})">
                    <div class="driver-header">
                        <div class="driver-avatar ${typeClass}"><i class="fas ${typeIcon}"></i></div>
                        <div class="driver-info">
                            <h3>${route.driver_name}</h3>
                            <p><i class="fas fa-car" style="color:var(--primary-light);"></i> ${route.car || (isBus ? 'باص' : 'سيارة')}</p>
                            <p><i class="fas fa-map-marker-alt" style="color:var(--danger);"></i> ${route.area}</p>
                            <p><i class="fas fa-chair" style="color:var(--warning);"></i> ${route.available_seats} مقاعد | <i class="fas fa-money-bill-wave" style="color:var(--success);"></i> ${route.price} د.ع</p>
                        </div>
                        ${distanceHTML}
                    </div>
                    <div class="contact-actions" onclick="event.stopPropagation()">
                        <a href="tel:${cleanPhone}" class="btn-call"><i class="fas fa-phone-alt"></i> اتصال</a>
                        <a href="https://wa.me/${waPhone}?text=${waMessage}" target="_blank" class="btn-wa"><i class="fab fa-whatsapp"></i> واتساب</a>
                    </div>
                </div>
                `;
            }).join('');
        }

        function focusOnDriver(phone, lat, lng) {
            document.querySelectorAll('.driver-card').forEach(el => el.classList.remove('highlight'));
            const card = document.getElementById(`card_${phone}`);
            if(card) card.classList.add('highlight');
            
            if(lat && lng) {
                closeSheet();
                map.flyTo([parseFloat(lat), parseFloat(lng)], 16, { animate: true, duration: 1.5 });
                if(busMarkers[phone]) busMarkers[phone].openPopup();
            } else {
                showToast('هذا السائق غير متصل بالخريطة حالياً', 'error');
            }
        }

        function updateSingleBus(bus) {
            if (!bus?.lat || !bus?.lng) return;
            
            // 🚨 تحديث وقت آخر استلام محلياً
            bus.last_seen = Date.now(); 

            const lat = parseFloat(bus.lat);
            const lng = parseFloat(bus.lng);
            
            let distance = null;
            let etaMins = null;
            if (studentLocation) {
                distance = parseFloat(calculateDistance(studentLocation.lat, studentLocation.lng, lat, lng));
                etaMins = Math.ceil((distance / 30) * 60);
            }

            let isClose = false;
            if (distance !== null && distance <= 0.5) {
                isClose = true;
                if (!notifiedDrivers.has(bus.driver_phone)) {
                    showToast(`🚨 تنبيه: الكابتن ${bus.driver_name} على وشك الوصول إليك!`, 'alert');
                    notifiedDrivers.add(bus.driver_phone);
                }
            } else if (distance !== null && distance > 0.6) {
                notifiedDrivers.delete(bus.driver_phone);
            }

            let iconToUse = bus.vehicle_type === 'bus' ? busIcon : carIcon;
            if (isClose) {
                iconToUse = L.divIcon({ 
                    className: 'custom-bus-icon pulse-close', 
                    html: `<div class="bus-icon-bg" style="background:#10b981; color:white; border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center; border:3px solid white; box-shadow:0 4px 10px rgba(0,0,0,0.3); transition: 0.3s;"><i class="fas ${bus.vehicle_type === 'bus' ? 'fa-bus' : 'fa-car'}" style="font-size:14px;"></i></div>`, 
                    iconSize: [36, 36], iconAnchor: [18, 18] 
                });
            }

            const etaPopupText = etaMins !== null ? (etaMins <= 1 ? 'وصل الآن!' : `الوصول بعد ${etaMins} دقيقة`) : 'غير متصل';
            const popupContent = `<b>كابتن ${bus.driver_name}</b><br>المناطق: ${bus.area}<br><span style="color:var(--primary); font-weight:900;">${etaPopupText}</span>`;

            if (busMarkers[bus.driver_phone]) {
                busMarkers[bus.driver_phone].setLatLng([lat, lng]);
                busMarkers[bus.driver_phone].setIcon(iconToUse);
                busMarkers[bus.driver_phone].setPopupContent(popupContent);
            } else {
                busMarkers[bus.driver_phone] = L.marker([lat, lng], { icon: iconToUse })
                    .addTo(map)
                    .bindPopup(popupContent)
                    .on('click', () => {
                        const cleanPhone = bus.driver_phone.replace(/\s+/g, '');
                        openDriversList();
                        setTimeout(() => {
                            const card = document.getElementById(`card_${cleanPhone}`);
                            if(card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }, 300);
                    });
            }

            if (bus.path && bus.path.length > 1) {
                if (busPaths[bus.driver_phone]) {
                    busPaths[bus.driver_phone].setLatLngs(bus.path);
                    busPaths[bus.driver_phone].setStyle({ color: isClose ? '#10b981' : (bus.vehicle_type === 'bus' ? '#3b82f6' : '#8b5cf6') });
                } else {
                    busPaths[bus.driver_phone] = L.polyline(bus.path, {
                        color: isClose ? '#10b981' : (bus.vehicle_type === 'bus' ? '#3b82f6' : '#8b5cf6'), 
                        weight: 4, opacity: 0.7, dashArray: '8, 8', lineJoin: 'round'
                    }).addTo(map);
                }
            }
        }

        async function fetchLiveBuses() {
            const { data } = await sb.from('live_buses').select('*');
            
            // تحديث القائمة وإضافة وقت الاستلام المحلي
            liveDrivers = (data || []).map(bus => {
                // إذا كان الباص موجوداً مسبقاً، نحافظ على وقت آخر استلام له
                const existing = liveDrivers.find(d => d.driver_phone === bus.driver_phone);
                bus.last_seen = existing ? existing.last_seen : Date.now();
                return bus;
            });

            const counter = document.getElementById('liveCounter');
            const countText = document.getElementById('busCount');
            if(liveDrivers.length > 0) {
                counter.style.display = 'flex';
                countText.textContent = liveDrivers.length;
            } else {
                counter.style.display = 'none';
            }

            const currentPhones = liveDrivers.map(b => b.driver_phone);

            // إزالة الباصات التي اختفت من قاعدة البيانات
            for (let phone in busMarkers) {
                if (!currentPhones.includes(phone)) {
                    map.removeLayer(busMarkers[phone]);
                    delete busMarkers[phone];
                    if (busPaths[phone]) {
                        map.removeLayer(busPaths[phone]);
                        delete busPaths[phone];
                    }
                }
            }

            liveDrivers.forEach(bus => updateSingleBus(bus));

            if(document.getElementById('mainSheet').classList.contains('open')) renderDrivers();
        }

        function loadLiveBuses() {
            fetchLiveBuses();

            sb.channel('live_buses_channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'live_buses' }, payload => {
                    
                    if (payload.eventType === 'DELETE') {
                        // 🚨 الحل الجذري: البحث عن الباص بواسطة الـ id وحذفه فوراً
                        const deletedId = payload.old.id;
                        const busToDelete = liveDrivers.find(b => b.id === deletedId);
                        
                        if (busToDelete) {
                            const phone = busToDelete.driver_phone;
                            if (busMarkers[phone]) { map.removeLayer(busMarkers[phone]); delete busMarkers[phone]; }
                            if (busPaths[phone]) { map.removeLayer(busPaths[phone]); delete busPaths[phone]; }
                            liveDrivers = liveDrivers.filter(d => d.id !== deletedId);
                        } else {
                            // إذا لم نجده بالـ ID، نقوم بتحديث شامل كخطة بديلة
                            fetchLiveBuses();
                        }
                    } else if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
                        const bus = payload.new;
                        if (!bus) return;
                        
                        bus.last_seen = Date.now(); // تحديث وقت الاستلام
                        updateSingleBus(bus);
                        
                        const idx = liveDrivers.findIndex(d => d.driver_phone === bus.driver_phone);
                        if(idx > -1) liveDrivers[idx] = bus;
                        else liveDrivers.push(bus);
                    }
                    
                    const counter = document.getElementById('liveCounter');
                    const countText = document.getElementById('busCount');
                    if(liveDrivers.length > 0) { counter.style.display = 'flex'; countText.textContent = liveDrivers.length; }
                    else { counter.style.display = 'none'; }

                    if(document.getElementById('mainSheet').classList.contains('open')) renderDrivers();
                }).subscribe();

            // 🚨 الفحص المحلي: كل 5 ثوانٍ نتحقق من وقت "آخر استلام". إذا مر 45 ثانية بدون تحديث، نمسحه.
            setInterval(() => {
                const now = Date.now();
                liveDrivers.forEach(bus => {
                    if (bus.last_seen && (now - bus.last_seen) > 45000) {
                        if (busMarkers[bus.driver_phone]) { map.removeLayer(busMarkers[bus.driver_phone]); delete busMarkers[bus.driver_phone]; }
                        if (busPaths[bus.driver_phone]) { map.removeLayer(busPaths[bus.driver_phone]); delete busPaths[bus.driver_phone]; }
                        liveDrivers = liveDrivers.filter(d => d.driver_phone !== bus.driver_phone);
                        
                        if(document.getElementById('mainSheet').classList.contains('open')) renderDrivers();
                        
                        const counter = document.getElementById('liveCounter');
                        const countText = document.getElementById('busCount');
                        if(liveDrivers.length > 0) { counter.style.display = 'flex'; countText.textContent = liveDrivers.length; }
                        else { counter.style.display = 'none'; }
                    }
                });
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadStudentData(); 
            locateStudent();
            loadLiveBuses();
        });
    </script>
</body>
