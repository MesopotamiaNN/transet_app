<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خطوط النقل - جامعة الناجي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e3a8a; --primary-light: #3b82f6; --accent: #8b5cf6;
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
            --bg: #f0f4ff; --white: #ffffff; --text: #1f2937; --text-muted: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; overflow: hidden; background: var(--bg); }
        
        /* الخريطة */
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* شريط الترحيب */
        .welcome-bar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            padding: 10px 25px; border-radius: 50px; box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            font-weight: 900; color: var(--primary); display: flex; align-items: center; gap: 10px;
            font-size: 0.95rem; white-space: nowrap; border: 1px solid rgba(255,255,255,0.5);
            transition: all 0.3s ease;
        }

        /* زر تحديد الموقع */
        .locate-btn {
            position: absolute; bottom: 110px; right: 20px; z-index: 1000;
            background: var(--white); color: var(--primary); width: 50px; height: 50px; border-radius: 50%;
            border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.15); font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;
        }
        .locate-btn:active { transform: scale(0.9); }

        /* شريط التنقل السفلي (زجاجي) */
        .bottom-nav {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 400px; height: 65px; background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px); z-index: 2000; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; justify-content: space-around; align-items: center;
            border: 1px solid rgba(255,255,255,0.6); padding: 0 10px;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 0.7rem; font-weight: 700; cursor: pointer;
            width: 25%; height: 100%; transition: all 0.3s ease; border-radius: 15px;
        }
        .nav-item i { font-size: 1.4rem; margin-bottom: 4px; transition: all 0.3s ease; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-2px); }
        .nav-item.test-driver { color: var(--danger); }

        /* القائمة السفلية */
        .bottom-sheet {
            position: absolute; bottom: -100%; left: 0; width: 100%; height: 70%;
            background: var(--white); z-index: 1500; border-radius: 30px 30px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.15); transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            display: flex; flex-direction: column;
        }
        .bottom-sheet.open { bottom: 0; }
        
        /* مقبض السحب في القائمة */
        .drag-handle { width: 40px; height: 5px; background: #cbd5e1; border-radius: 5px; margin: 10px auto 0; }
        
        .sheet-header { padding: 10px 20px 15px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
        .sheet-header h2 { font-size: 1.1rem; color: var(--primary); font-weight: 900; display: flex; align-items: center; gap: 8px; }
        .close-btn { background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: var(--text-muted); transition: 0.2s; }
        .close-btn:active { background: #e2e8f0; }

        /* فلتر المناطق */
        .filter-box { padding: 12px 20px; background: var(--white); border-bottom: 1px solid #f1f5f9; }
        .filter-box select {
            width: 100%; padding: 10px 15px; border-radius: 12px; border: 1.5px solid #e2e8f0;
            font-family: 'Cairo'; font-weight: 700; color: var(--primary); outline: none;
            background: #f8fafc; transition: border 0.3s;
        }
        .filter-box select:focus { border-color: var(--primary-light); }

        .list-container { padding: 15px 20px 100px 20px; overflow-y: auto; flex: 1; }
        
        /* كرت السائق */
        .driver-card {
            background: var(--white); border: 1.5px solid #f1f5f9; border-radius: 16px;
            padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02); transition: transform 0.2s, box-shadow 0.2s;
        }
        .driver-card:active { transform: scale(0.98); }
        .driver-info h3 { font-size: 1.05rem; color: var(--text); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .driver-info p { font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
        
        .book-btn {
            background: var(--primary); color: white; border: none; padding: 10px 20px;
            border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 0.85rem; transition: 0.3s;
            box-shadow: 0 4px 10px rgba(30,58,138,0.2);
        }
        .book-btn:active { transform: scale(0.95); }
        .book-btn:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; }

        /* حالات الحجز */
        .status-badge { padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; }
        .status-pending { background: #fef3c7; color: #d97706; }
        .status-accepted { background: #d1fae5; color: #059669; }
        .status-rejected { background: #fee2e2; color: #dc2626; }

        /* الإشعارات (Toasts) */
        #toastContainer { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 5000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 350px; pointer-events: none; }
        .toast {
            background: var(--white); color: var(--text); padding: 12px 20px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); font-weight: 700; font-size: 0.9rem;
            display: flex; align-items: center; gap: 10px; transform: translateY(-20px); opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-right: 4px solid var(--primary);
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-right-color: var(--success); }
        .toast.error { border-right-color: var(--danger); }
        .toast i { font-size: 1.2rem; }
        .toast.success i { color: var(--success); }
        .toast.error i { color: var(--danger); }

        /* نافذة تأكيد الحجز */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 3000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--white); padding: 25px; border-radius: 24px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); transform: scale(0.9); transition: 0.3s; }
        .modal.show .modal-content { transform: scale(1); }
        .modal-content h3 { color: var(--primary); margin-bottom: 10px; font-size: 1.2rem; }
        .modal-content p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
        .modal-content button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 800; font-family: 'Cairo'; cursor: pointer; font-size: 1rem; margin-bottom: 10px; transition: 0.3s; }
        .modal-content button:active { transform: scale(0.95); }
        .modal-content .btn-cancel { background: #f1f5f9; color: var(--text-muted); }

        /* مؤشر التحميل */
        .spinner { width: 30px; height: 30px; border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="welcome-bar" id="welcomeBar" style="display: none;">
        <i class="fas fa-user-graduate" style="color: var(--accent);"></i> أهلاً، <span id="stdNameDisplay"></span>
    </div>

    <button class="locate-btn" onclick="locateStudent()" title="تحديد موقعي">
        <i class="fas fa-crosshairs"></i>
    </button>

    <!-- القائمة السفلية -->
    <div class="bottom-sheet" id="mainSheet">
        <div class="drag-handle"></div>
        <div class="sheet-header">
            <h2 id="sheetTitle"><i class="fas fa-bus"></i> السائقون المتاحون</h2>
            <button class="close-btn" onclick="closeSheet()"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="filter-box" id="areaFilterBox">
            <select id="areaSelect" onchange="renderDrivers()">
                <option value="all">📍 كل المناطق</option>
            </select>
        </div>

        <div class="list-container" id="listContainer"></div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-map" onclick="closeSheet()">
            <i class="fas fa-map-marked-alt"></i> الخريطة
        </div>
        <div class="nav-item" id="nav-drivers" onclick="openDriversList()">
            <i class="fas fa-bus-alt"></i> السائقين
        </div>
        <div class="nav-item" id="nav-bookings" onclick="openMyBookings()">
            <i class="fas fa-ticket-alt"></i> حجوزاتي
        </div>
        <div class="nav-item test-driver" onclick="window.location.href='Driver.html'">
            <i class="fas fa-user-tie"></i> تجربة
        </div>
    </div>

    <!-- نافذة تأكيد الحجز -->
    <div class="modal" id="bookingModal">
        <div class="modal-content">
            <h3><i class="fas fa-check-circle" style="color:var(--success); font-size:2rem; margin-bottom:10px;"></i><br>تأكيد الحجز</h3>
            <p>خط: <strong id="modalArea" style="color:var(--primary);"></strong><br>هل أنت متأكد من طلب الحجز؟</p>
            <button onclick="confirmBooking()">نعم، احجز مقعدي</button>
            <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
        </div>
    </div>

    <!-- حاوية الإشعارات -->
    <div id="toastContainer"></div>

    <script>
        // 1. إعداد الخريطة
        const map = L.map('map', { zoomControl: false }).setView([33.2765, 44.3380], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.control.zoom({ position: 'topright' }).addTo(map);

        const busIcon = L.divIcon({
            className: 'custom-bus-icon',
            html: '<div style="background:#1e3a8a; color:white; border-radius:50%; width:35px; height:35px; display:flex; align-items:center; justify-content:center; border:3px solid white; box-shadow:0 4px 10px rgba(0,0,0,0.3);"><i class="fas fa-bus"></i></div>',
            iconSize: [35, 35], iconAnchor: [17, 17]
        });

        const userIcon = L.divIcon({
            className: 'user-icon',
            html: '<div style="background:#3b82f6; border:3px solid white; border-radius:50%; width:20px; height:20px; box-shadow:0 0 10px rgba(59,130,246,0.8);"></div>',
            iconSize: [20, 20], iconAnchor: [10, 10]
        });

        let userMarker = null;
        let studentLocation = null;
        let selectedDriverPhone = null;
        let currentStudent = null;
        let allDrivers = [];

        // 2. إعداد Supabase (ضع المفاتيح هنا)
        const SUPABASE_URL = "ضع_رابط_المشروع_هنا";
        const SUPABASE_KEY = "ضع_المفتاح_anon_هنا";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 3. نظام الإشعارات الأنيق
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle');
            toast.innerHTML = `<i class="fas ${icon}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // 4. جلب بيانات الطالب (مع التجاوز للتجربة)
        async function loadStudentData() {
            const urlParams = new URLSearchParams(window.location.search);
            const regId = urlParams.get('reg_id');

            if (!regId) {
                // تجاوز تسجيل الدخول للتجربة
                currentStudent = { reg_id: 'TEST-123', name: 'طالب تجريبي' };
                document.getElementById('stdNameDisplay').textContent = currentStudent.name;
                document.getElementById('welcomeBar').style.display = 'flex';
                return;
            }

            const { data, error } = await sb.from('students').select('*').eq('reg_id', regId).single();
            if (data) {
                currentStudent = data;
                document.getElementById('stdNameDisplay').textContent = data.name;
                document.getElementById('welcomeBar').style.display = 'flex';
            } else {
                showToast("رقم التسجيل غير موجود", "error");
            }
        }

        // 5. تحديد الموقع
        function locateStudent() {
            if (!navigator.geolocation) return showToast("جهازك لا يدعم تحديد الموقع", "error");
            
            const btn = document.querySelector('.locate-btn i');
            btn.className = 'fas fa-spinner fa-spin'; // تأثير التحميل

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    studentLocation = { lat, lng };
                    
                    if (userMarker) userMarker.setLatLng([lat, lng]);
                    else userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map).bindPopup("<b>موقعك الحالي</b>");
                    
                    map.flyTo([lat, lng], 16, { animate: true, duration: 1.5 });
                    btn.className = 'fas fa-crosshairs'; // إرجاع الأيقونة
                    showToast("تم تحديد موقعك بنجاح");
                },
                (err) => { 
                    showToast("تعذر تحديد الموقع. تأكد من تفعيل GPS.", "error"); 
                    btn.className = 'fas fa-crosshairs';
                },
                { enableHighAccuracy: true }
            );
        }

        // 6. إدارة الواجهة
        function setActiveNav(id) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(id !== 'test') document.getElementById(id).classList.add('active');
        }

        function closeSheet() {
            document.getElementById('mainSheet').classList.remove('open');
            setActiveNav('nav-map');
        }

        function closeModal() {
            document.getElementById('bookingModal').classList.remove('show');
            setTimeout(() => { document.getElementById('bookingModal').style.display = 'none'; }, 300);
        }

        // 7. قسم السائقين
        async function openDriversList() {
            setActiveNav('nav-drivers');
            document.getElementById('sheetTitle').innerHTML = '<i class="fas fa-bus"></i> السائقون المتاحون';
            document.getElementById('areaFilterBox').style.display = 'block';
            document.getElementById('mainSheet').classList.add('open');
            document.getElementById('listContainer').innerHTML = '<div class="spinner"></div>';
            
            const { data } = await sb.from('routes').select('*').eq('active', true);
            allDrivers = data || [];
            
            const areas = [...new Set(allDrivers.map(d => d.area))];
            const select = document.getElementById('areaSelect');
            select.innerHTML = '<option value="all">📍 كل المناطق</option>' + areas.map(a => `<option value="${a}">${a}</option>`).join('');

            renderDrivers();
        }

        function renderDrivers() {
            const filter = document.getElementById('areaSelect').value;
            const filtered = filter === 'all' ? allDrivers : allDrivers.filter(d => d.area === filter);
            const list = document.getElementById('listContainer');

            if (filtered.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:30px; font-weight:700;">لا يوجد سائقون متاحون حالياً.</p>';
                return;
            }

            list.innerHTML = filtered.map(route => `
                <div class="driver-card">
                    <div class="driver-info">
                        <h3><i class="fas fa-user-circle" style="color:var(--accent);"></i> ${route.driver_name}</h3>
                        <p><i class="fas fa-car" style="color:var(--primary-light);"></i> ${route.car || 'سيارة غير محددة'}</p>
                        <p><i class="fas fa-map-marker-alt" style="color:var(--danger);"></i> ${route.area} &nbsp;|&nbsp; <i class="fas fa-chair" style="color:var(--warning);"></i> ${route.available_seats} مقاعد</p>
                    </div>
                    <button class="book-btn" onclick="openModal('${route.driver_phone}', '${route.area}')" ${route.available_seats <= 0 ? 'disabled' : ''}>
                        ${route.available_seats <= 0 ? 'مكتمل' : 'حجز'}
                    </button>
                </div>
            `).join('');
        }

        // 8. قسم حجوزاتي
        async function openMyBookings() {
            if (!currentStudent) return showToast("يرجى تسجيل الدخول أولاً", "error");
            setActiveNav('nav-bookings');
            document.getElementById('sheetTitle').innerHTML = '<i class="fas fa-ticket-alt"></i> سجل حجوزاتي';
            document.getElementById('areaFilterBox').style.display = 'none';
            document.getElementById('mainSheet').classList.add('open');
            document.getElementById('listContainer').innerHTML = '<div class="spinner"></div>';

            const { data } = await sb.from('bookings')
                .select('*, routes(driver_name, area)')
                .eq('student_reg_id', currentStudent.reg_id)
                .order('created_at', { ascending: false });

            const list = document.getElementById('listContainer');
            if (!data || data.length === 0) {
                list.innerHTML = '<div style="text-align:center; margin-top:40px;"><i class="fas fa-box-open" style="font-size:3rem; color:#cbd5e1; margin-bottom:10px;"></i><p style="color:var(--text-muted); font-weight:700;">ليس لديك أي حجوزات سابقة.</p></div>';
                return;
            }

            list.innerHTML = data.map(b => {
                let statusText = "قيد الانتظار", statusClass = "status-pending";
                if (b.status === 'accepted') { statusText = "مقبول"; statusClass = "status-accepted"; }
                if (b.status === 'rejected') { statusText = "مرفوض"; statusClass = "status-rejected"; }

                return `
                <div class="driver-card" style="flex-direction: column; align-items: flex-start; gap:8px;">
                    <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="font-size:1rem; color:var(--primary);"><i class="fas fa-route"></i> خط ${b.routes?.area || 'غير محدد'}</h3>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                    <p style="font-size:0.85rem; color:var(--text-muted);"><i class="fas fa-user-tie"></i> السائق: ${b.routes?.driver_name || 'غير معروف'}</p>
                    <p style="font-size:0.75rem; color:#94a3b8;"><i class="far fa-clock"></i> ${new Date(b.created_at).toLocaleString('ar-IQ')}</p>
                </div>`;
            }).join('');
        }

        // 9. إتمام الحجز
        function openModal(phone, area) {
            selectedDriverPhone = phone;
            document.getElementById('modalArea').textContent = area;
            document.getElementById('bookingModal').style.display = 'flex';
            setTimeout(() => document.getElementById('bookingModal').classList.add('show'), 10);
        }

        async function confirmBooking() {
            closeModal();
            if (!currentStudent) return;

            const { error } = await sb.from('bookings').insert([{
                driver_phone: selectedDriverPhone,
                student_reg_id: currentStudent.reg_id,
                student_name: currentStudent.name,
                student_lat: studentLocation ? studentLocation.lat : null,
                student_lng: studentLocation ? studentLocation.lng : null,
                status: 'pending'
            }]);

            if (error) showToast('حدث خطأ أثناء الحجز', 'error');
            else showToast('تم إرسال طلب الحجز بنجاح!', 'success');
        }

        // 10. تتبع الباصات
        const busMarkers = {};
        async function loadLiveBuses() {
            const { data } = await sb.from('live_buses').select('*');
            (data || []).forEach(drawBus);
            sb.channel('live_buses_channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'live_buses' }, payload => {
                    if (payload.eventType === 'DELETE') {
                        if (busMarkers[payload.old.driver_phone]) {
                            map.removeLayer(busMarkers[payload.old.driver_phone]);
                            delete busMarkers[payload.old.driver_phone];
                        }
                    } else { drawBus(payload.new); }
                }).subscribe();
        }

        function drawBus(bus) {
            if (!bus?.lat || !bus?.lng) return;
            if (busMarkers[bus.driver_phone]) {
                busMarkers[bus.driver_phone].setLatLng([bus.lat, bus.lng]);
            } else {
                busMarkers[bus.driver_phone] = L.marker([bus.lat, bus.lng], { icon: busIcon }).addTo(map)
                    .bindPopup(`<b>كابتن ${bus.driver_name}</b><br>خط ${bus.area}`);
            }
        }

        // التشغيل
        document.addEventListener('DOMContentLoaded', () => {
            loadStudentData(); 
            locateStudent(); // يطلب الموقع مباشرة
            loadLiveBuses();
        });
    </script>
</body>
</html>
