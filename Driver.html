<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لوحة السائق - جامعة الناجي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root { --primary: #1e3a8a; --primary-light: #3b82f6; --accent: #8b5cf6; --success: #10b981; --danger: #ef4444; --bg: #f0f4ff; --white: #ffffff; --text: #1f2937; --text-muted: #64748b; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { height: 100%; overflow: hidden; background: var(--bg); }
    
    #setupScreen { position: absolute; inset: 0; background: var(--bg); z-index: 5000; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
    .setup-card { background: var(--white); padding: 30px 20px; border-radius: 24px; width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
    .setup-card h2 { color: var(--primary); text-align: center; margin-bottom: 25px; font-size: 1.4rem; font-weight: 900; }
    .field { margin-bottom: 15px; }
    .field label { display: block; font-size: 0.85rem; font-weight: 800; margin-bottom: 8px; color: var(--text); }
    .field input { width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 0.95rem; font-weight: 700; outline: none; font-family: 'Cairo'; background: #f8fafc; }
    .field input:focus { border-color: var(--primary-light); background: var(--white); }
    .btn-main { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 900; font-family: 'Cairo'; cursor: pointer; margin-top: 10px; }

    #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    .bottom-nav { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 400px; height: 65px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); z-index: 2000; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: none; justify-content: space-around; align-items: center; padding: 0 10px; }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); font-size: 0.7rem; font-weight: 700; cursor: pointer; width: 33%; height: 100%; transition: 0.3s; }
    .nav-item i { font-size: 1.4rem; margin-bottom: 4px; }
    .nav-item.active { color: var(--primary); }
    .nav-item.end-trip { color: var(--danger); }

    .bottom-sheet { position: absolute; bottom: -100%; left: 0; width: 100%; height: 65%; background: var(--white); z-index: 1500; border-radius: 30px 30px 0 0; transition: bottom 0.4s ease; display: flex; flex-direction: column; }
    .bottom-sheet.open { bottom: 0; }
    .drag-handle { width: 40px; height: 5px; background: #cbd5e1; border-radius: 5px; margin: 10px auto 0; }
    .sheet-header { padding: 10px 20px 15px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    .sheet-header h2 { font-size: 1.1rem; color: var(--primary); font-weight: 900; }
    .close-btn { background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
    .list-container { padding: 15px 20px 100px 20px; overflow-y: auto; flex: 1; }

    .booking-card { background: var(--white); border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 15px; margin-bottom: 12px; }
    .booking-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 10px; }
    .booking-header h4 { color: var(--primary); font-size: 1.05rem; }
    .booking-actions { display: flex; gap: 10px; }
    .btn-accept { flex: 1; background: var(--success); color: white; border: none; padding: 10px; border-radius: 10px; font-weight: 800; font-family: 'Cairo'; }
    .btn-reject { flex: 1; background: #fee2e2; color: var(--danger); border: none; padding: 10px; border-radius: 10px; font-weight: 800; font-family: 'Cairo'; }

    .status-badge { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 10px 25px; border-radius: 50px; font-weight: 900; display: none; align-items: center; gap: 10px; font-size: 0.9rem; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #cbd5e1; }
    .status-badge.live { color: var(--success); }
    .status-badge.live .status-dot { background: var(--success); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    #toastContainer { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 6000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 350px; pointer-events: none; }
    .toast { background: var(--white); padding: 12px 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); font-weight: 700; transform: translateY(-20px); opacity: 0; transition: 0.3s; border-right: 4px solid var(--primary); }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { border-right-color: var(--danger); }
    .toast.new-booking { border-right-color: var(--accent); }
</style>
</head>
<body>

    <div id="setupScreen">
        <div class="setup-card">
            <h2><i class="fas fa-id-card"></i> تسجيل السائق</h2>
            <div class="field"><label>الاسم الكامل</label><input id="fName" placeholder="مثال: أحمد علي"></div>
            <div class="field"><label>رقم الهاتف</label><input id="fPhone" type="tel" placeholder="07XXXXXXXXX"></div>
            <div class="field"><label>المنطقة / الخط</label><input id="fArea" placeholder="مثال: اليرموك"></div>
            <div class="field"><label>نوع السيارة</label><input id="fCar" placeholder="مثال: كيا باص"></div>
            <div style="display:flex; gap:10px;">
                <div class="field" style="flex:1;"><label>المقاعد</label><input id="fSeats" type="number" value="4"></div>
                <div class="field" style="flex:1;"><label>السعر (د.ع)</label><input id="fPrice" type="number" value="50000"></div>
            </div>
            <div class="field"><label>وقت الانطلاق</label><input id="fTime" placeholder="07:00 صباحاً"></div>
            <button class="btn-main" onclick="saveDriver()">حفظ ومتابعة</button>
        </div>
    </div>

    <div id="map"></div>
    
    <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span> <span id="statusText">أنت متصل (مباشر)</span>
    </div>

    <div class="bottom-sheet" id="mainSheet">
        <div class="drag-handle"></div>
        <div class="sheet-header">
            <h2><i class="fas fa-bell"></i> طلبات الحجز</h2>
            <button class="close-btn" onclick="closeSheet()"><i class="fas fa-times"></i></button>
        </div>
        <div class="list-container" id="bookingsList"><p style="text-align:center; color:var(--text-muted); margin-top:30px; font-weight:700;">لا توجد طلبات حالياً.</p></div>
    </div>

    <div class="bottom-nav" id="driverNav">
        <div class="nav-item active" onclick="closeSheet()"><i class="fas fa-map-marked-alt"></i> الخريطة</div>
        <div class="nav-item" onclick="openBookings()"><i class="fas fa-bell"></i> الحجوزات <span id="notifDot" style="display:none; background:red; width:8px; height:8px; border-radius:50%; position:absolute; top:10px; right:25px;"></span></div>
        <div class="nav-item end-trip" onclick="stopTrip()"><i class="fas fa-power-off"></i> إنهاء</div>
    </div>

    <div id="toastContainer"></div>

    <script>
        const map = L.map('map', { zoomControl: false }).setView([33.2765, 44.3380], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.control.zoom({ position: 'topright' }).addTo(map);

        const busIcon = L.divIcon({ className: 'custom-bus-icon', html: '<div style="background:#1e3a8a; color:white; border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; border:3px solid white;"><i class="fas fa-bus" style="font-size:18px;"></i></div>', iconSize: [40, 40], iconAnchor: [20, 20] });
        const studentIcon = L.divIcon({ className: 'custom-student-icon', html: '<div style="background:#8b5cf6; color:white; border-radius:50%; width:35px; height:35px; display:flex; align-items:center; justify-content:center; border:3px solid white;"><i class="fas fa-user-graduate" style="font-size:16px;"></i></div>', iconSize: [35, 35], iconAnchor: [17, 17] });

        let driver = null, watchId = null, myMarker = null;
        const studentMarkers = {};

        // --- مفاتيح Supabase الخاصة بك ---
        const SUPABASE_URL = "https://ewivzdrrujuwhkuqqgei.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3aXZ6ZHJydWp1d2hrdXFxZ2VpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1OTMwNDQsImV4cCI6MjEwNTE2OTA0NH0.ng8N-08Pl2SOr42Dw01fLSG6n8C17BNTG5XDVPdisM8";

        let sb = null;
        try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { console.error("Supabase Error"); }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : (type === 'new-booking' ? 'fa-bell' : 'fa-check-circle')}"></i> <span>${message}</span>`;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3500);
        }

        async function saveDriver() {
            const name = document.getElementById('fName').value.trim();
            const phone = document.getElementById('fPhone').value.trim();
            const area = document.getElementById('fArea').value.trim();
            const car = document.getElementById('fCar').value.trim();
            const seats = parseInt(document.getElementById('fSeats').value) || 4;
            const price = parseInt(document.getElementById('fPrice').value) || 0;
            const time = document.getElementById('fTime').value.trim();

            if (!name || !phone || !area) return showToast('الاسم والهاتف والمنطقة مطلوبة', 'error');

            driver = { name, phone, area, car, seats, price, time };
            localStorage.setItem('driver', JSON.stringify(driver));

            if (sb) {
                try {
                    const { error } = await sb.from('routes').upsert({ driver_phone: phone, driver_name: name, car, area, total_seats: seats, available_seats: seats, price, time, active: true }, { onConflict: 'driver_phone' });
                    if (error) throw error;
                } catch (err) { showToast('فشل الاتصال بقاعدة البيانات', 'error'); }
            }
            startDashboard();
        }

        function startDashboard() {
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('driverNav').style.display = 'flex';
            document.getElementById('statusBadge').style.display = 'flex';
            setTimeout(() => map.invalidateSize(), 200);
            startTrip();
            if(sb) listenToBookings();
        }

        function closeSheet() { document.getElementById('mainSheet').classList.remove('open'); }
        function openBookings() { document.getElementById('mainSheet').classList.add('open'); document.getElementById('notifDot').style.display = 'none'; }

        function startTrip() {
            if (!navigator.geolocation) return showToast('جهازك لا يدعم تحديد الموقع', 'error');
            watchId = navigator.geolocation.watchPosition(onPosition, onError, { enableHighAccuracy: true });
            document.getElementById('statusBadge').classList.add('live');
            showToast('تم بدء الرحلة، أنت الآن مباشر!');
        }

        async function stopTrip() {
            if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            if (sb) await sb.from('live_buses').delete().eq('driver_phone', driver.phone);
            document.getElementById('statusBadge').classList.remove('live');
            document.getElementById('driverNav').style.display = 'none';
            showToast('تم إنهاء الرحلة بنجاح');
            setTimeout(() => { window.location.reload(); }, 1500);
        }

        let lastSent = 0;
        async function onPosition(pos) {
            const { latitude: lat, longitude: lng } = pos.coords;
            if (!myMarker) { myMarker = L.marker([lat, lng], { icon: busIcon }).addTo(map).bindPopup("<b>أنت هنا</b>"); map.setView([lat, lng], 16); }
            else { myMarker.setLatLng([lat, lng]); }

            const now = Date.now();
            if (now - lastSent < 2000) return;
            lastSent = now;

            if (sb) await sb.from('live_buses').upsert({ driver_phone: driver.phone, driver_name: driver.name, area: driver.area, lat, lng, updated_at: new Date().toISOString() }, { onConflict: 'driver_phone' });
        }

        function onError(err) { showToast('تعذر جلب الموقع. تأكد من GPS.', 'error'); }

        async function listenToBookings() {
            loadBookings();
            sb.channel('driver_bookings').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'bookings', filter: `driver_phone=eq.${driver.phone}` }, payload => {
                showToast('وصلك طلب حجز جديد!', 'new-booking');
                document.getElementById('notifDot').style.display = 'block';
                loadBookings();
            }).subscribe();
        }

        async function loadBookings() {
            if(!sb) return;
            const { data } = await sb.from('bookings').select('*').eq('driver_phone', driver.phone).eq('status', 'pending');
            const list = document.getElementById('bookingsList');
            if (!data || data.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:30px; font-weight:700;">لا توجد طلبات جديدة حالياً.</p>';
                return;
            }
            list.innerHTML = data.map(b => `
                <div class="booking-card" id="book_${b.id}">
                    <div class="booking-header"><h4><i class="fas fa-user-graduate"></i> ${b.student_name}</h4></div>
                    <div class="booking-actions">
                        <button class="btn-accept" onclick="handleBooking('${b.id}', 'accepted', ${b.student_lat}, ${b.student_lng}, '${b.student_name}')">قبول</button>
                        <button class="btn-reject" onclick="handleBooking('${b.id}', 'rejected')">رفض</button>
                    </div>
                </div>
            `).join('');
        }

        async function handleBooking(id, status, sLat, sLng, sName) {
            if(!sb) return;
            await sb.from('bookings').update({ status: status }).eq('id', id);
            document.getElementById(`book_${id}`).remove();
            
            if (status === 'accepted') {
                showToast('تم قبول الطالب بنجاح');
                const { data: route } = await sb.from('routes').select('available_seats').eq('driver_phone', driver.phone).single();
                if (route && route.available_seats > 0) await sb.from('routes').update({ available_seats: route.available_seats - 1 }).eq('driver_phone', driver.phone);
                
                if (sLat && sLng) {
                    if (studentMarkers[id]) map.removeLayer(studentMarkers[id]);
                    studentMarkers[id] = L.marker([sLat, sLng], { icon: studentIcon }).addTo(map).bindPopup(`<b>الطالب: ${sName}</b>`);
                    map.flyTo([sLat, sLng], 15, { animate: true, duration: 1.5 });
                }
            } else { showToast('تم رفض الطلب', 'error'); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('driver');
            if (saved) { driver = JSON.parse(saved); startDashboard(); }
        });
    </script>
</body>
</html>
